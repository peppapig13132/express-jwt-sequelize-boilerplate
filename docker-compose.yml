services:
  postgres:
    image: postgres:16-alpine
    container_name: express-boilerplate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-express_boilerplate}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN:-postgres} -d ${DB_NAME:-express_boilerplate}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: express-boilerplate-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      NODE_ENV: development
      APP_PORT: 8000
      SECRETKEY: ${SECRETKEY:-dev-docker-secret-key-at-least-32-characters-long}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-express_boilerplate}
      DB_ADMIN: ${DB_ADMIN:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SYNC: ${DB_SYNC:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
