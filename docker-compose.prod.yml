services:
  postgres:
    image: postgres:16-alpine
    container_name: express-boilerplate-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-express_boilerplate}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN:-postgres} -d ${DB_NAME:-express_boilerplate}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express-boilerplate-app-prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      NODE_ENV: production
      APP_PORT: 8000
      SECRETKEY: ${SECRETKEY:?Set SECRETKEY in .env.docker before running production}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-express_boilerplate}
      DB_ADMIN: ${DB_ADMIN:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SYNC: ${DB_SYNC:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data_prod:
